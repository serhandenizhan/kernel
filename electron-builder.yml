# Kernel paketleri: macOS (ad-hoc imzalı, Apple imzası yok) ve Windows (NSIS kurulum, imzasız)
appId: app.kernel.notes
productName: Kernel
copyright: Copyright © 2026 Kernel contributors
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dir
      arch: arm64
    - target: dmg
      arch: arm64
  identity: "-"
  hardenedRuntime: false
  darkModeSupport: true
dmg:
  title: Kernel
  artifactName: Kernel-${version}-${arch}.${ext}
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: Kernel-Setup-${version}.${ext}
