# v* etiketi gönderilince macOS (.dmg) ve Windows (.exe) paketleri derlenip GitHub sürümüne yüklenir
name: Release
on:
  push:
    tags: ['v*']
  # elle: main'den derleyip var olan bir sürüme yükler (örn. etiketteki iş akışı başarısız olduysa)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Yüklenecek sürüm etiketi (örn. v0.5.0)'
        required: true
env:
  TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: write
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # sürüm zaten varsa (elle oluşturulduysa) dokunulmaz; docs/release-notes/<etiket>.md varsa not olarak o kullanılır
      - run: gh release view "$TAG" || gh release create "$TAG" --title "Kernel ${TAG#v}" $( [ -f "docs/release-notes/$TAG.md" ] && echo --notes-file "docs/release-notes/$TAG.md" || echo --generate-notes )
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist
            files: release/*.dmg release/*-mac.zip
          - os: windows-latest
            dist: dist:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.dist }} -- --publish never
        env:
          # electron-builder kendi başına yayımlamasın; yüklemeyi aşağıdaki adım yapar
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: gh release upload "$TAG" ${{ matrix.files }} --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
